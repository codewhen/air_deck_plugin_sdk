name: SDK tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deck-plugins/go.mod
          cache-dependency-path: deck-plugins/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Go SDK and plugins
        run: go -C deck-plugins test ./...
      - name: Python SDK
        run: python3 -m unittest discover -s deck-plugins/sdk/python/tests -v
      - name: Capability contracts
        run: python3 -m unittest discover -s capabilities/tests -p test_contracts.py -v
      - name: Package plugins
        run: bash deck-plugins/scripts/build_all.sh
      - name: Developer documentation
        run: python3 tools/check_docs.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Get Gson from Maven Central
        run: curl --fail --location https://repo.maven.apache.org/maven2/com/google/code/gson/gson/2.11.0/gson-2.11.0.jar --output /tmp/gson.jar
      - name: Build standalone tutorial packages
        run: python3 tools/build_examples.py all --gson /tmp/gson.jar
      - name: Verify extracted tutorial packages
        run: python3 tools/test_packaged_examples.py deck-plugins/dist/examples/*/*.deckPlugin
      - name: Generate and verify all-language starters
        run: GSON_JAR=/tmp/gson.jar python3 tools/test_starters.py
